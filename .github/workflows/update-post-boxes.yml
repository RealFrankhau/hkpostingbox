name: Update postal-box data

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Fetch and format postal-box data
        run: python extract_mailpost.py
      - name: Commit data when changed
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/post-boxes.json mailpost.txt
          git diff --cached --quiet
          $diffExitCode = $LASTEXITCODE
          if ($diffExitCode -eq 0) {
            echo "Postal-box data is already up to date."
          } elseif ($diffExitCode -eq 1) {
            git commit -m "Update postal-box data"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            git push
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } else {
            exit $diffExitCode
          }
