name: Update postal-box data

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Fetch and format postal-box data
        run: python extract_mailpost.py
      - name: Commit data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/post-boxes.json mailpost.txt
          if git diff --cached --quiet; then
            echo "Postal-box data is already up to date."
          else
            git commit -m "Update postal-box data"
            git push
          fi
